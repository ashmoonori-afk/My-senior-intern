name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Build macOS probe helper
        if: runner.os == 'macOS'
        run: >-
          clang -fobjc-arc -Wall -Wextra -Werror -dynamiclib
          -arch arm64 -arch x86_64 -mmacosx-version-min=11.0
          -framework Foundation -framework FileProvider
          src/senior_intern/fileops/native/omt_darwin_probe.m
          src/senior_intern/fileops/native/omt_darwin_trust.m
          -o src/senior_intern/fileops/native/libomt_darwin_probe.dylib
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run basedpyright
      - name: Test
        run: uv run pytest -q -m "not live"
